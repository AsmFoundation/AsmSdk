# The documentation site, https://asmfoundation.github.io/AsmSdk/.
#
# Builds docs/ with DocFX (pinned in .config/dotnet-tools.json) on every pull request that
# touches the site, so broken links fail review: --warningsAsErrors turns DocFX's link and
# bookmark warnings into errors. On main it also deploys the site to GitHub Pages.
# Actions are pinned by commit, like the rest of this repository's workflows.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one in flight, so the
# live site is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history: DocFX reads git for each page's source links

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore DocFX
        run: dotnet tool restore

      - name: Build the site
        run: dotnet docfx build docs/docfx.json --warningsAsErrors

      # llms.txt, llms-full.txt and a .html.md copy of every page, for AI tools (docs/llms.cs).
      # Runs on pull requests too: it fails on a toc entry or a page link that leads nowhere.
      - name: Write the files for AI tools
        run: dotnet run docs/llms.cs -- docs docs/_site https://asmfoundation.github.io/AsmSdk/

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # publish to GitHub Pages
      id-token: write   # the deployment proves its origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
