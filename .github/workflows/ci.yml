# CI - on each build-machine OS: stage that OS's bundled toolchain, pack AsmFoundation.Sdk and
# its toolchain package, and run the end-to-end tests (tests/AsmSdk.Tests).
#
# One job per OS, independent of the others: a slow runner of one OS (hosted macOS runners can
# queue for many minutes) does not hold up the results of the other two. Each job:
#   1. toolchain/fetch.cs (a .NET 10 file-based app) stages NASM + LLVM tools for its RID.
#      NASM is built from source on Linux (static) and macOS (native arm64), which is why each
#      RID needs its own OS. The staged folder is cached by the hash of the pins and the
#      program, so the 0.9-2 GB LLVM archives are only downloaded when a pin changes.
#   2. tests/AsmSdk.Tests (xunit v3, dotnet test) packs the SDK and that toolchain, builds the
#      samples and the test projects with them, and checks the ELF outputs with the bundled
#      llvm-readobj, the package layouts, incremental builds and IDE integration; on Ubuntu it
#      also runs the executables and the .NET sample that P/Invokes the shared libraries
#      (elsewhere those tests are skipped with the reason: ASMSDK_TEST_RUN=none).
#   The only prerequisite is the .NET SDK: no Python since 0.2.0.
#   3. The staged toolchain is kept as an artifact: release.yml packs all three from it.
#
# Also called by release.yml, so a release is tested exactly like a push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only Linux can run the Linux outputs; the others build and inspect them.
          - rid: win-x64
            os: windows-2025
            run: none
          - rid: linux-x64
            os: ubuntu-24.04
            run: native
          - rid: osx-arm64
            os: macos-15
            run: none
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      # The staged tools are a pure function of the pins and the program that stages them.
      - name: Cache the staged toolchain
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/toolchain/${{ matrix.rid }}
          key: toolchain-${{ matrix.rid }}-${{ hashFiles('toolchain/versions.json', 'toolchain/fetch.cs') }}

      - name: Stage NASM and LLVM tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: dotnet run toolchain/fetch.cs -- --rid ${{ matrix.rid }}

      - name: Show the tools
        shell: bash
        run: |
          ls -l artifacts/toolchain/${{ matrix.rid }}/tools
          cat artifacts/toolchain/${{ matrix.rid }}/tools/VERSIONS.txt

      # global.json selects Microsoft.Testing.Platform, which `dotnet test --project` needs.
      - name: Pack the SDK, build the samples, check every output
        env:
          ASMSDK_TEST_RUN: ${{ matrix.run }}
          ASMSDK_TEST_DOTNET_RUN: ${{ matrix.run }}
        run: dotnet test --project tests/AsmSdk.Tests/AsmSdk.Tests.csproj -c Release

      - name: Keep the staged toolchain for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-${{ matrix.rid }}
          path: artifacts/toolchain/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 7
