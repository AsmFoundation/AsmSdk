# Release - publishes one version of AsmFoundation.Sdk when a tag vX.Y.Z is pushed:
#   1. ci        the whole CI workflow on the tagged commit (all five build machines)
#   2. versions  the tag must equal <Version> in Directory.Build.props
#   3. nuget     AsmFoundation.Sdk <version>, AsmFoundation.Templates <version> (the dotnet new
#                templates, released with the SDK of the same version, whose version they
#                write into new projects) and AsmFoundation.Toolchain.<rid> (win-x64,
#                win-arm64, linux-x64, linux-arm64, osx-arm64) to nuget.org through trusted
#                publishing (no API key).
#                Toolchain packages carry their own version (toolchain/versions.json): pushing
#                an unchanged one is skipped (--skip-duplicate), so an SDK-only release does
#                not upload ~120 MB of tools again.
#   4. release   a GitHub release whose notes are the version's CHANGELOG section, with the
#                packages attached.
#
# Prerequisites (configured once):
#   - nuget.org trusted publishing policy for AsmFoundation/AsmSdk, workflow release.yml,
#     environment nuget (package owner elibelash, packages AsmFoundation.*);
#   - the GitHub environment "nuget", restricted to tags v*.*.*;
#   - the repository variable NUGET_USER: the nuget.org profile name.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  versions:
    name: Tag and version agree
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag that disagrees with the project version would publish packages under one
      # version and a release under another.
      - name: Compare
        id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          sdk="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          if [ "$tag" != "$sdk" ]; then
            echo "::error::tag v$tag and Directory.Build.props <Version> '$sdk' must be equal"
            exit 1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$tag]' section to use as the release notes"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  nuget:
    name: Packages to nuget.org
    needs: [ci, versions]
    runs-on: ubuntu-24.04
    # Trusted publishing binds the policy to repository, workflow file AND environment.
    environment: nuget
    permissions:
      contents: read
      id-token: write   # lets NuGet/login request this job's OIDC token
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Fetch the staged toolchains
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: toolchain-*
          path: artifacts/staged

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/toolchain
          for d in artifacts/staged/toolchain-*; do mv "$d" "artifacts/toolchain/${d##*/toolchain-}"; done
          dotnet pack src/AsmFoundation.Sdk/AsmFoundation.Sdk.csproj -c Release -nologo
          dotnet pack src/AsmFoundation.Templates/AsmFoundation.Templates.csproj -c Release -nologo
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-arm64; do
            dotnet pack toolchain/AsmFoundation.Toolchain.csproj -c Release -nologo -p:ToolchainRid=$rid
          done
          ls -l artifacts/packages

      - name: Keep the packages for the GitHub release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

      # GitHub's OIDC token for this job becomes a nuget.org API key valid for about an hour,
      # limited to what the policy allows.
      - name: Log in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  release:
    name: GitHub release
    needs: [versions, nuget]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/packages

      # The notes are the version's CHANGELOG section without its heading, up to the next one.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AsmFoundation.Sdk $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/packages/*.nupkg
