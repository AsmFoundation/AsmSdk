<!doctype html>
<!--
  The source of the Wasm Demos' link-preview cards (docs/images/cards/<demo>.jpg): what X, Slack, Discord,
  LinkedIn and the rest draw when someone shares a demo page. Each card is the demo's own frame, full bleed,
  with a white badge naming it. The owner picked this design on 2026-11-26. docs/og.cs names the card in each
  demo page's og:image after DocFX builds the site; every other page gets images/cards/asmsdk.png, the
  repository's social preview (kept in AsmFoundation/AsmFoundation site/card/repos/AsmSdk.png).

  Not published (DocFX's content is Markdown and YAML, its resources images/ and demos/*.wasm|js). Render one
  card per demo, from the repository root:

    chrome --headless=new --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=3000
           --force-device-scale-factor=2 --window-size=1200,630
           --screenshot=docs/cards/<demo>.png "file:///<absolute path>/docs/cards/card.html?d=<demo>"

  then save it as docs/images/cards/<demo>.jpg at JPEG quality 86, or lower until it is under about 280 KB (a
  photo-like frame is several times smaller as JPEG, and WhatsApp drops previews much over 300 KB; the swarm's
  grain needed 82). The PNG render is not kept.
  - --allow-file-access-from-files is required, or Chrome refuses the @font-face files from a file:// page.
  - 2400x1260 (1200x630 at 2x): the 1.91:1 frame X and LinkedIn draw.
  - X lays the shared page's title over the bottom-left corner: the badge sits top-left.
  - frames/ holds one capture of each live demo's canvas (2x, its border cropped), taken in a throw-away
    headless Chrome on 2026-11-26: Life zoomed in to 8 pixels a cell, the ray-marched scene once sharpened,
    the swarm pushed outward with the button held. Any frame of the demo will do; recapture after a demo
    changes how it looks.
  - An unknown ?d= renders "?" and no frame, so a typo shows in the render.
-->
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("../template/public/fonts/archivo-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Martian Mono"; src: url("../template/public/fonts/martian-mono-latin.woff2") format("woff2"); font-weight: 100 800; }
  html, body { margin: 0; background: #fff; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #14181b;
    font-family: "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  /* the 16:9 canvas cropped to 1.91:1, centered */
  .frame { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .logo-a .m { fill: #3eea8c; } .logo-a .t { fill: #06706d; }
  .badge { position: absolute; left: 40px; top: 40px; background: #fff; border-radius: 10px; padding: 18px 26px 20px;
    box-shadow: 0 6px 24px rgba(0,0,0,.28); max-width: 660px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-stretch: 116%; letter-spacing: -.01em;
    color: #062f2e; font-size: 24px; }
  h1 { margin: 12px 0 0; font-weight: 800; font-stretch: 116%; letter-spacing: -.024em; color: #062f2e; font-size: 44px; line-height: 1.05; }
  p { margin: 10px 0 0; font: 500 18px "Martian Mono", monospace; color: #5b656b; }
</style></head>
<body>
<div class="card">
  <div class="frame" id="frame"></div>
  <div class="badge">
    <div class="brand"><svg class="logo-a" viewBox="236 204 782 746" width="34" height="32" aria-hidden="true"><rect class="m" x="559" y="214" width="135" height="135"/><rect class="m" x="414" y="372" width="129" height="125"/><rect class="m" x="559" y="372" width="135" height="125"/><rect class="m" x="712" y="372" width="127" height="125"/><rect class="t" x="349" y="524" width="138" height="121"/><rect class="t" x="766" y="524" width="138" height="121"/><rect class="t" x="288" y="665" width="139" height="124"/><rect class="t" x="451" y="665" width="351" height="121"/><rect class="t" x="826" y="665" width="139" height="124"/><rect class="t" x="246" y="811" width="156" height="129"/><rect class="t" x="850" y="811" width="158" height="129"/></svg>AsmSdk · Wasm Demos</div>
    <h1 id="t">?</h1>
    <p>hand-written WebAssembly, every pixel</p>
  </div>
</div>
<script>
  // Each demo's name as its page titles it (the <title> before " | AsmSdk"), and its frame.
  var demos = {
    life: { title: "Life, 16 million cells", frame: "frames/life.png" },
    ray: { title: "A ray-marched scene", frame: "frames/ray.png" },
    swarm: { title: "Particle swarm", frame: "frames/swarm.jpg" }
  };
  var d = new URLSearchParams(location.search).get("d") || "";
  if (Object.prototype.hasOwnProperty.call(demos, d)) {
    document.getElementById("t").textContent = demos[d].title;
    document.getElementById("frame").style.backgroundImage = "url(" + demos[d].frame + ")";
  }
</script>
</body></html>
